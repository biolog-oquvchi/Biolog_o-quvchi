<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biolog o'quvchi</title>
    <style>
        /* Asosiy stillar */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding-bottom: 20px; }
        header { background: #047857; color: white; padding: 15px; text-align: center; font-weight: bold; }
        main { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .hidden { display: none !important; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #059669; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 10px 0; }
        .option-btn { width: 100%; text-align: left; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; margin-bottom: 8px; cursor: pointer; }
        .option-btn.selected { background: #dcfce7; border-color: #22c55e; }
    </style>
</head>
<body>

    <header>🍃 Biolog o'quvchi</header>

    <main>
        <!-- 1. LOGIN QISMI (Ism kiritish) -->
        <div id="login-card" class="card">
            <h3>Xush kelibsiz!</h3>
            <p style="font-size: 13px; color: #64748b; margin-bottom: 10px;">Testni boshlash uchun ismingizni kiriting:</p>
            <input type="text" id="student-name" placeholder="Ism va Familiya">
            <button onclick="saveAndStart()" class="btn">Testni boshlash</button>
        </div>

        <!-- 2. "Qaytgan o'quvchi" uchun karta -->
        <div id="welcome-back-card" class="card hidden">
            <h3 id="welcome-msg"></h3>
            <button onclick="continueQuiz()" class="btn">Testni davom etish</button>
            <button onclick="changeName()" class="btn" style="background: #64748b; margin-top: 10px;">Ismni o'zgartirish</button>
        </div>

        <!-- 3. TEST QISMI -->
        <div id="quiz-card" class="card hidden">
            <div id="q-text" style="font-weight: bold; margin-bottom: 15px;"></div>
            <div id="options-container"></div>
            <button onclick="nextQuestion()" class="btn">Keyingisi</button>
        </div>

        <!-- 4. NATIJA -->
        <div id="result-card" class="card hidden">
            <h3>Test yakunlandi!</h3>
            <p id="score-text"></p>
            <button onclick="location.reload()" class="btn">Bosh sahifa</button>
        </div>
    </main>

    <script>
        const TELEGRAM_BOT_TOKEN = "8970538193:AAHUjH0FvHIaw1jjq7XZ2iPhBVM-L2uuyi8";
        const TELEGRAM_CHAT_ID = "244331420";

        // Boshlang'ich savollar
        let questions = JSON.parse(localStorage.getItem('bio_questions')) || [
            { text: "Fotosintez qaysi organoidda boradi?", options: ["Xloroplast", "Mitoxondriya", "Ribosoma", "Yadro"], correct: 0 }
        ];

        let currentQ = 0, score = 0, selectedOption = null;

        // Sahifa yuklanganda tekshirish
        window.onload = () => {
            const savedName = localStorage.getItem('user_name');
            if (savedName) {
                showWelcomeBack(savedName);
            }
        };

        function showWelcomeBack(name) {
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('welcome-back-card').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "Yana xush kelibsiz, " + name + "!";
        }

        function saveAndStart() {
            const name = document.getElementById('student-name').value.trim();
            if (!name) { alert("Ismingizni yozing!"); return; }
            localStorage.setItem('user_name', name);
            continueQuiz();
        }

        function changeName() {
            localStorage.removeItem('user_name');
            location.reload();
        }

        function continueQuiz() {
            document.getElementById('login-card').classList.add('hidden');
            document.getElementById('welcome-back-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQ];
            document.getElementById('q-text').innerText = (currentQ+1) + ". " + q.text;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedOption = idx;
                };
                container.appendChild(btn);
            });
        }

        function nextQuestion() {
            if (selectedOption === null) { alert("Javob tanlang!"); return; }
            if (selectedOption === questions[currentQ].correct) score++;
            
            currentQ++;
            if (currentQ < questions.length) {
                showQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            const name = localStorage.getItem('user_name');
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('score-text').innerText = name + ", siz " + questions.length + " ta savoldan " + score + " tasiga to'g'ri javob berdingiz.";
            
            // Telegramga yuborish
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: `📊 ${name}: ${score}/${questions.length} ball` })
            });
        }
    </script>
</body>
</html>
