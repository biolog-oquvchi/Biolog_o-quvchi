<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Biolog o'quvchi</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto 20px; }
        button { width: 100%; padding: 12px; border: none; background: #059669; color: white; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; margin: 10px 0; box-sizing: border-box; }
        .hidden { display: none; }
        .selected { background: #d1fae5 !important; border: 1px solid #059669 !important; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div id="app" style="max-width: 500px; margin: auto;">
    <!-- Kirish -->
    <div id="login-card" class="card">
        <h3>Biolog o'quvchi</h3>
        <input type="text" id="user-name" placeholder="Ism va familiyangiz">
        <button onclick="startApp()">Testni boshlash</button>
        <button onclick="openAdmin()" style="background: #475569;">⚙️ Admin paneli</button>
    </div>

    <!-- Test -->
    <div id="quiz-card" class="card hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span id="q-num" style="font-size: 13px; color: #666;"></span>
            <span id="q-points" class="badge"></span>
        </div>
        <div id="q-text" style="font-weight: bold; margin-bottom: 15px;"></div>
        <div id="opts-box"></div>
        <button onclick="next()">Keyingisi</button>
    </div>

    <!-- Admin -->
    <div id="admin-card" class="card hidden">
        <h3>Admin: Savol qo'shish</h3>
        <select id="q-type" onchange="toggleFields()">
            <option value="choice">Variantli (Test)</option>
            <option value="text">Yozma (Ochiq)</option>
        </select>
        <input type="text" id="new-text" placeholder="Savol matni">
        
        <div id="choice-fields">
            <input type="text" id="opt-0" placeholder="A variant">
            <input type="text" id="opt-1" placeholder="B variant">
            <input type="text" id="opt-2" placeholder="C variant">
            <input type="text" id="opt-3" placeholder="D variant">
            <label>To'g'ri javob:</label>
            <select id="correct-idx"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
        </div>
        <div id="text-fields" class="hidden">
            <input type="text" id="correct-text" placeholder="To'g'ri yozma javob">
        </div>
        
        <input type="number" id="new-points" placeholder="Balli">
        <button onclick="addQ()">Savolni qo'shish</button>
        <button onclick="closeAdmin()" style="background: #64748b;">Orqaga</button>
    </div>
</div>

<script>
    const TOKEN = "8970538193:AAHUjH0FvHIaw1jjq7XZ2iPhBVM-L2uuyi8";
    const CHAT_ID = "244331420";
    
    let qs = JSON.parse(localStorage.getItem('qs')) || [];
    let state = { qIdx: 0, score: 0, maxScore: 0, selected: null };

    function startApp() {
        let name = document.getElementById('user-name').value.trim();
        if(!name) return alert("Ism kiriting!");
        localStorage.setItem('uname', name);
        state.qIdx = 0; state.score = 0;
        state.maxScore = qs.reduce((sum, q) => sum + (q.points || 1), 0);
        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('quiz-card').classList.remove('hidden');
        showQ();
    }

    function showQ() {
        let q = qs[state.qIdx];
        document.getElementById('q-num').innerText = `Savol: ${state.qIdx + 1} / ${qs.length}`;
        document.getElementById('q-points').innerText = `Ball: ${q.points || 1}`;
        document.getElementById('q-text').innerText = q.text;
        let box = document.getElementById('opts-box');
        box.innerHTML = '';
        if(q.type === 'text') {
            box.innerHTML = `<input type="text" id="user-ans" placeholder="Javobingizni yozing...">`;
        } else {
            q.options.forEach((o, i) => {
                box.innerHTML += `<button onclick="sel(this, ${i})" style="text-align:left; background:#fff; border:1px solid #ddd; color:#333">${String.fromCharCode(65+i)}) ${o}</button>`;
            });
        }
    }

    function sel(el, i) {
        document.querySelectorAll('#opts-box button').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        state.selected = i;
    }

    function next() {
        let q = qs[state.qIdx];
        if(q.type === 'text') {
            let val = document.getElementById('user-ans').value.trim().toLowerCase();
            if(val === q.correctText.toLowerCase()) state.score += (q.points || 1);
        } else {
            if(state.selected === null) return alert("Javob tanlang!");
            if(state.selected === q.correct) state.score += (q.points || 1);
        }
        state.qIdx++;
        if(state.qIdx < qs.length) { state.selected = null; showQ(); }
        else finish();
    }

    function finish() {
        let name = localStorage.getItem('uname');
        fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({chat_id: CHAT_ID, text: `📊 Natija:\n👤 ${name}\n⭐ Ball: ${state.score} / ${state.maxScore}`})
        });
        alert(`Test tugadi! Ball: ${state.score} / ${state.maxScore}`);
        location.reload();
    }

    function toggleFields() {
        let type = document.getElementById('q-type').value;
        document.getElementById('choice-fields').classList.toggle('hidden', type === 'text');
        document.getElementById('text-fields').classList.toggle('hidden', type === 'choice');
    }

    function addQ() {
        let type = document.getElementById('q-type').value;
        let text = document.getElementById('new-text').value;
        let points = parseInt(document.getElementById('new-points').value) || 1;
        if(type === 'text') {
            qs.push({type, text, correctText: document.getElementById('correct-text').value, points});
        } else {
            qs.push({type, text, options: [document.getElementById('opt-0').value, document.getElementById('opt-1').value, document.getElementById('opt-2').value, document.getElementById('opt-3').value], correct: parseInt(document.getElementById('correct-idx').value), points});
        }
        localStorage.setItem('qs', JSON.stringify(qs));
        alert("Saqlandi!");
    }

    function openAdmin() { if(prompt("Parol:") === "8888") { document.getElementById('login-card').classList.add('hidden'); document.getElementById('admin-card').classList.remove('hidden'); } }
    function closeAdmin() { location.reload(); }
</script>
</body>
</html>
